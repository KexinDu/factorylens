name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      train_model:
        description: Run the upstream model training pipeline after tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      OPENLUX_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check backend ml scripts
      - run: python -m pytest
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.train_model }}
        run: python scripts/train.py
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
