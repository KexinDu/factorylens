[project]
name = "machineguard-ai"
version = "1.0.0"
description = "Predictive maintenance and industrial anomaly detection platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1", "pandas>=2.2,<3", "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "joblib>=1.4,<2",
  "matplotlib>=3.9,<4", "seaborn>=0.13,<1", "shap>=0.46,<1", "mlflow>=2.17,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ml*"]
